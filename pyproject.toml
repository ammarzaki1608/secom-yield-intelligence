[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "secom"
version = "0.1.0"
description = "Leakage-safe SECOM yield analysis: loading, splitting and cleaning."
requires-python = ">=3.10"
dependencies = ["pandas", "numpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]